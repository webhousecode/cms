name: Deploy webhouse.app

on:
  push:
    branches: [main]
    # A deploy RESTARTS the single production machine, and anyone mid-request
    # loses it. Measured 28 Aug 2026: Christian was reading a chat answer on
    # webhouse.app when a DOCUMENTATION commit (93d4ca92) deployed. His answer
    # stopped mid-sentence at "###" and the site went unreachable for ~50s.
    # It happened twice in one evening; the second time nothing shipped that
    # could possibly change the running app.
    #
    # So a change that cannot affect the running app must not restart it. Note
    # this is paths-IGNORE, not paths: the default is still to deploy. A new
    # directory nobody thought about ships, rather than silently not shipping —
    # the failure we can afford is an unnecessary deploy, not a missing one.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".claude/**"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build --filter='!@webhouse/cms-admin'

      - name: Typecheck
        run: pnpm lint

      # F178.1 — the step that gates a deploy must run the suites that actually
      # work, and a failure must LOOK like one.
      #
      # It read `pnpm test:run || echo "⚠️ Tests with native modules skipped on CI"`,
      # written into the very first deployment commit rather than in response to
      # an observed failure. Two things were wrong with it, and the second is
      # the one that mattered:
      #
      #   1. `||` swallowed EVERY failure, so a real regression was reported in
      #      the same reassuring words as a limitation someone chose to live with.
      #   2. `pnpm test:run` from the repo ROOT has never worked. Measured
      #      28 Aug 2026: 45 test FILES fail to load (exit 1) while 1505 tests
      #      pass — the root workspace collects Playwright e2e specs and stale
      #      `.next/standalone` build artefacts as if they were unit tests, and
      #      cms-admin's own suite does not load at all because the `@/` alias
      #      is not applied. So this step has never once run the tests it names.
      #
      # These are the per-package commands test.yml already runs green. Still
      # NON-BLOCKING (see `continue-on-error`) — arming the gate is F178.3, and
      # it waits until the ~1-in-10 unexplained cms-admin failure is named
      # (F178.2). A gate that cries wolf gets switched off, which is worse than
      # no gate.
      - name: CMS core tests
        continue-on-error: true
        run: cd packages/cms && npx vitest run

      - name: CMS admin tests
        continue-on-error: true
        run: cd packages/cms-admin && npx vitest run

  deploy:
    name: Deploy to Fly.io
    needs: check
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-webhouse-app
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only --build-arg NEXT_PUBLIC_UPMETRICS_DSN="${{ vars.NEXT_PUBLIC_UPMETRICS_DSN }}" --build-arg GIT_SHA="${{ github.sha }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Notify Discord
        if: always()
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then
            COLOR=3066993
            EMOJI="✅"
            MSG="**webhouse.app deployed** to production"
          else
            COLOR=15158332
            EMOJI="❌"
            MSG="**webhouse.app deploy failed**"
          fi
          COMMIT_MSG=$(git log -1 --pretty=format:'%s' HEAD)
          ACTOR="${{ github.actor }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "${{ secrets.DEPLOY_DISCORD_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"$EMOJI $MSG\",\"description\":\"$COMMIT_MSG\",\"color\":$COLOR,\"fields\":[{\"name\":\"Site\",\"value\":\"[webhouse.app](https://webhouse.app)\",\"inline\":true},{\"name\":\"Triggered by\",\"value\":\"$ACTOR\",\"inline\":true},{\"name\":\"Run\",\"value\":\"[View]($RUN_URL)\",\"inline\":true}]}]}" || true
