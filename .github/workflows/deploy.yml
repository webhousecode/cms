name: Deploy webhouse.app

on:
  push:
    branches: [main]
    # A deploy RESTARTS the single production machine, and anyone mid-request
    # loses it. Measured 28 Aug 2026: Christian was reading a chat answer on
    # webhouse.app when a DOCUMENTATION commit (93d4ca92) deployed. His answer
    # stopped mid-sentence at "###" and the site went unreachable for ~50s.
    # It happened twice in one evening; the second time nothing shipped that
    # could possibly change the running app.
    #
    # So a change that cannot affect the running app must not restart it. Note
    # this is paths-IGNORE, not paths: the default is still to deploy. A new
    # directory nobody thought about ships, rather than silently not shipping —
    # the failure we can afford is an unnecessary deploy, not a missing one.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".claude/**"
      - "LICENSE"
      # Test-only paths. Nothing under these ships in the runtime image, so a
      # change confined to them cannot alter what production serves — and a
      # deploy is an interruption of whoever is using the admin at that moment.
      #
      # This is safe in the direction that matters: paths-ignore skips a run
      # only when EVERY changed file matches, so a commit touching both a test
      # and src/ still deploys. The affordable failure here is an unnecessary
      # deploy, never a missing one.
      - "packages/cms-admin/e2e/**"
      - "**/__tests__/**"
      - "**/*.test.ts"
      - "**/*.spec.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # F193.3 — PORTEN. Den KALDER Tests-arbejdsgangen frem for at gentage den,
  # så der findes ÉN definition af «prøverne er grønne».
  #
  # Det den erstatter var en port der næsten ikke kunne gå rød: jobbet hed
  # «Lint & Typecheck» og kørte begge enheds-suiter med `continue-on-error:
  # true`, så kun typecheck blokerede. E2E kørte slet ikke her — den bor i
  # test.yml, som udrulningen ikke kendte. Resultat: E2E-suiten stod rød i over
  # 100 kørsler i træk uden at stoppe én eneste udrulning, og fejlen blev
  # diagnosticeret tre gange (F178.5, F178.7, F193.1) uden at nogen mærkede den.
  #
  # Prisen, sagt højt frem for opdaget bagefter: en udrulning venter nu på hele
  # suiten inkl. browser-prøverne (~12 min mod ~4 før). Det er hvad en port
  # koster. Er den for dyr, er svaret at gøre suiten hurtigere — ikke at slukke
  # den igen.
  gate:
    name: Port — typecheck, enhedsprøver, E2E
    uses: ./.github/workflows/test.yml
    secrets: inherit

  # F201.17 — no deploy while a secret sits anywhere in the history.
  secret-gate:
    uses: broberg-ai/components/.github/workflows/secret-gate.yml@secret-gate-v1

  # A late run must never roll prod back. The concurrency group on `deploy`
  # only cancels a deploy running at the same moment; on 23 Oct 2026 the OLDEST
  # of three runs finished its gate last and replaced newer live code.
  # Fly labels each image with the sha it was built from (GH_SHA).
  stale:
    name: Skip if newer code is already live
    needs: [gate, secret-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.stale.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: superfly/flyctl-actions/setup-flyctl@98172f70657cb3e15db199af139be99bd3e61200 # master, same pin as fly-server-deploy
        with:
          version: "0.5.1"
      - id: stale
        run: |
          LIVE=$(flyctl image show --app webhouse-app --json | jq -r '.[0].Labels // "{}" | fromjson | .GH_SHA // empty')
          echo "live=$LIVE candidate=$GITHUB_SHA"
          if bash scripts/deploy-is-stale.sh "$GITHUB_SHA" "$LIVE"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipped: $LIVE is newer than $GITHUB_SHA and already live."
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  # The deploy itself is the fleet-shared workflow (owner 27/11 2026): single-
  # writer guard, machine-plan/verify and health-verify come from components.
  deploy:
    name: Deploy to Fly.io
    needs: [stale]
    if: needs.stale.outputs.skip != 'true'
    concurrency:
      group: deploy-webhouse-app
      cancel-in-progress: true
    uses: broberg-ai/components/.github/workflows/fly-server-deploy.yml@main
    with:
      app: webhouse-app
      # One machine: the data lives on the `cms_data` volume.
      ha: false
      health_url: https://webhouse.app/home
      # The shared workflow passes a 7-char GIT_SHA; the later full-sha arg
      # wins, so Upmetrics releases keep their current naming.
      extra_deploy_args: --build-arg NEXT_PUBLIC_UPMETRICS_DSN=${{ vars.NEXT_PUBLIC_UPMETRICS_DSN }} --build-arg GIT_SHA=${{ github.sha }}
    secrets:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  notify:
    name: Notify Discord
    needs: [deploy]
    if: always() && needs.deploy.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Notify Discord
        env:
          RESULT: ${{ needs.deploy.result }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WEBHOOK: ${{ secrets.DEPLOY_DISCORD_WEBHOOK }}
        run: |
          if [ "$RESULT" = "success" ]; then
            COLOR=3066993; EMOJI="✅"; MSG="**webhouse.app deployed** to production"
          else
            COLOR=15158332; EMOJI="❌"; MSG="**webhouse.app deploy failed**"
          fi
          COMMIT_MSG=$(git log -1 --pretty=format:'%s' HEAD)
          BODY=$(jq -n --arg t "$EMOJI $MSG" --arg d "$COMMIT_MSG" --argjson c "$COLOR" --arg a "$ACTOR" --arg r "$RUN_URL" \
            '{embeds:[{title:$t,description:$d,color:$c,fields:[{name:"Site",value:"[webhouse.app](https://webhouse.app)",inline:true},{name:"Triggered by",value:$a,inline:true},{name:"Run",value:("[View](" + $r + ")"),inline:true}]}]}')
          curl -s -X POST "$WEBHOOK" -H "Content-Type: application/json" -d "$BODY" || true
