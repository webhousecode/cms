name: Deploy webhouse.app

on:
  push:
    branches: [main]
    # A deploy RESTARTS the single production machine, and anyone mid-request
    # loses it. Measured 28 Aug 2026: Christian was reading a chat answer on
    # webhouse.app when a DOCUMENTATION commit (93d4ca92) deployed. His answer
    # stopped mid-sentence at "###" and the site went unreachable for ~50s.
    # It happened twice in one evening; the second time nothing shipped that
    # could possibly change the running app.
    #
    # So a change that cannot affect the running app must not restart it. Note
    # this is paths-IGNORE, not paths: the default is still to deploy. A new
    # directory nobody thought about ships, rather than silently not shipping —
    # the failure we can afford is an unnecessary deploy, not a missing one.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".claude/**"
      - "LICENSE"
      # Test-only paths. Nothing under these ships in the runtime image, so a
      # change confined to them cannot alter what production serves — and a
      # deploy is an interruption of whoever is using the admin at that moment.
      #
      # This is safe in the direction that matters: paths-ignore skips a run
      # only when EVERY changed file matches, so a commit touching both a test
      # and src/ still deploys. The affordable failure here is an unnecessary
      # deploy, never a missing one.
      - "packages/cms-admin/e2e/**"
      - "**/__tests__/**"
      - "**/*.test.ts"
      - "**/*.spec.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # F193.3 — PORTEN. Den KALDER Tests-arbejdsgangen frem for at gentage den,
  # så der findes ÉN definition af «prøverne er grønne».
  #
  # Det den erstatter var en port der næsten ikke kunne gå rød: jobbet hed
  # «Lint & Typecheck» og kørte begge enheds-suiter med `continue-on-error:
  # true`, så kun typecheck blokerede. E2E kørte slet ikke her — den bor i
  # test.yml, som udrulningen ikke kendte. Resultat: E2E-suiten stod rød i over
  # 100 kørsler i træk uden at stoppe én eneste udrulning, og fejlen blev
  # diagnosticeret tre gange (F178.5, F178.7, F193.1) uden at nogen mærkede den.
  #
  # Prisen, sagt højt frem for opdaget bagefter: en udrulning venter nu på hele
  # suiten inkl. browser-prøverne (~12 min mod ~4 før). Det er hvad en port
  # koster. Er den for dyr, er svaret at gøre suiten hurtigere — ikke at slukke
  # den igen.
  gate:
    name: Port — typecheck, enhedsprøver, E2E
    uses: ./.github/workflows/test.yml
    secrets: inherit

  deploy:
    name: Deploy to Fly.io
    needs: gate
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-webhouse-app
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only --build-arg NEXT_PUBLIC_UPMETRICS_DSN="${{ vars.NEXT_PUBLIC_UPMETRICS_DSN }}" --build-arg GIT_SHA="${{ github.sha }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Notify Discord
        if: always()
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then
            COLOR=3066993
            EMOJI="✅"
            MSG="**webhouse.app deployed** to production"
          else
            COLOR=15158332
            EMOJI="❌"
            MSG="**webhouse.app deploy failed**"
          fi
          COMMIT_MSG=$(git log -1 --pretty=format:'%s' HEAD)
          ACTOR="${{ github.actor }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "${{ secrets.DEPLOY_DISCORD_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"$EMOJI $MSG\",\"description\":\"$COMMIT_MSG\",\"color\":$COLOR,\"fields\":[{\"name\":\"Site\",\"value\":\"[webhouse.app](https://webhouse.app)\",\"inline\":true},{\"name\":\"Triggered by\",\"value\":\"$ACTOR\",\"inline\":true},{\"name\":\"Run\",\"value\":\"[View]($RUN_URL)\",\"inline\":true}]}]}" || true
